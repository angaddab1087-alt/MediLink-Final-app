# One command to run everything:  docker compose up --build
# App:  http://localhost:5173      API:  http://localhost:4000/api
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: medilink
      POSTGRES_PASSWORD: medilink
      POSTGRES_DB: medilink
    ports: ["5432:5432"]
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medilink"]
      interval: 5s
      retries: 20

  api:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://medilink:medilink@db:5432/medilink
      JWT_SECRET: change-me-in-production
      QR_SECRET: change-me-too
      UPLOAD_DIR: /data/uploads
      CORS_ORIGIN: "*"
      DEMO_MODE: "true"
    ports: ["4000:4000"]
    volumes: [uploads:/data/uploads]
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    ports: ["5173:80"]
    depends_on: [api]

volumes:
  dbdata:
  uploads:
